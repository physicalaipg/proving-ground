# 色彩门阈值表（内部工单；裁定 2026-10-01-30 相对一致性制）。代码不写死阈值，全部从这里读。
# 空值（null）＝未定稿：门只报原始值、不判，退出码 3，不得作发布依据。10-04 门一实拍后按 B3 规则填：
#   中性度／曝光＝门一过门片段分布的 P95 加 20% 裕量；一致性＝其余片段对基准片段 ΔE2000 的 P95 加 20%；裁切、码率沿用补丁 11 值。
version: v0
status: 10-04 定稿          # 阈值填完并经主理人拍板后改为「v0 定稿」

reference:                  # ③ 基准片段＝10-04 门一首条过门片段（原片，不入仓；只记路径与 sha256）
  path: null                # 10-04 定稿
  sha256: null              # 10-04 定稿
  t: null                   # 基准片段取样秒（null＝同 --t）

preflight:                  # 预检：原片直方图呈 log 形态（黑位抬高＋低对比／灰平）→ 直接 FAIL「profile 误用」，不进五项
  y_p1_min: 32              # 样帧亮度 Y 的 P1 ≥ 此值（Normal 直出有真黑时 P1 贴近 16）
  y_spread_max: 150         # P99 − P1 ≤ 此值（低对比）
  chroma_max: 14            # 全帧平均彩度 C* ≤ 此值（灰平）
  # 判 log 的规则：y_p1 条满足，且 spread 或 chroma 任一条满足。只在合成片上验过；10-04 的 D-Log M 对照条（ref-compare）须触发本项，否则回调。

neutral:                    # ① 中性度：灰区直出 Lab 的 |a*|、|b*| 上限
  a_abs_max: null           # 10-04 定稿
  b_abs_max: null           # 10-04 定稿

exposure:                   # ② 曝光：同一灰区 L* 区间
  L_min: null               # 10-04 定稿
  L_max: null               # 10-04 定稿

consistency:                # ③ 跨场次一致性：固定场景锚点区对基准片段同区的 ΔE2000 上限
  de2000_max: null          # 10-04 定稿

clip:                       # ④ 裁切（补丁 11 定义不动）：样帧 Y ≥ 235 占比上限；暗部 Y ≤ 16 只报数
  highlight_max: 0.01
  shadow_max: null          # 只报数

bitrate:                    # ⑤ 码率（原片即母版）：视频流码率下限；null＝只报数。另核原片 sha256 已在账本（补丁 11 ⑤ 的归档要求）
  min_bps: null
