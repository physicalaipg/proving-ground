# 被测模型表（DEC-20260925-04；PG-001 补丁 4 P2／修订 1／修订 2，2026-09-25）。
# 配置即身份：本表键＝榜单行名＝厂商模型 ID＋思考档＋端点（official 官方／aggregator 聚合），改任一项＝新行；思考档写进键名（nothink／think-low…）。
# 首季名单（首期榜 10-29）＝国产三厂各一：qwen3-vl-plus、glm-5v-turbo、deepseek-flash，均「思考关·官方端点」；备胎＝火山方舟豆包视觉款；
#   海外行保留为候选、标「待投稿／待合规通道」（补丁 3「≥1 海外」要求作废，见 DEC-20260925-18）；Kimi K3 标「待争议澄清」不进首季。
# 密钥只从环境变量读（key_env），不入仓；runner 跑前打印 provider+model+thinking+endpoint。
# price_*：美元/百万 token（人民币价 ÷ _settings.fx_cny_per_usd）；price_verified=false 的行成本记 0、run_batch 默认拒跑。
# 每步请求量（harness 常量，protocol/v0.md §4）：图像 512×384 JPEG q85 ＋ system（≈230 词）＋ instruction（≈60 词）＋ 最近 3 条 note；
#   估算口径（P5）：每回合 ≈60 次调用、每次输入 ≈700 tok、思考关时输出 ≈40 tok；N=30 → 1,800 次/模型。实测以 docs/pilot-run-01.md 为准。
_settings:
  fx_cny_per_usd: 7.1            # 汇率假设（2026-09 粗算，与 protocol/kit-candidates.md 同）；summary.csv 人民币列＝美元×此值
  season: 2026Q4 首季＝国产三厂各一（补丁 4 修订 1／2）；海外行经投稿或后续批次

